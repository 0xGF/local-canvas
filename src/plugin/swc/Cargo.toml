[package]
name = "local_canvas_swc_plugin"
version = "0.1.0"
edition = "2021"
description = "SWC plugin that stamps JSX elements with data-source-* attrs for Local Canvas"
repository = "https://github.com/0xGF/local-canvas"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"

[dependencies]
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_core = { version = "64.0.*", features = ["ecma_plugin_transform"] }

[dev-dependencies]
# Host-only crates used by the end-to-end test that parses real JSX, runs the
# visitor, and asserts on the emitted code. Not linked into the wasm build
# (dev-deps never are), so the plugin binary stays lean. Versions match what
# swc_core 64 resolves transitively — keep in lockstep.
swc_common = "=21.0.1"
swc_ecma_ast = "=23.0.0"
swc_ecma_codegen = "=26.0.1"
swc_ecma_parser = { version = "=39.0.0", features = ["typescript"] }
swc_ecma_visit = "=23.0.0"

# .cargo/config.toml defines aliases to build the plugin.
# cargo build-wasip1 → wasm32-wasip1 binary
# cargo build-wasm32 → wasm32-unknown-unknown binary
