[package]
name = "local_canvas_swc_plugin"
version = "0.1.0"
edition = "2021"
description = "SWC plugin that stamps JSX elements with data-source-* attrs for Local Canvas"
repository = "https://github.com/0xGF/local-canvas"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"

[dependencies]
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swc_core = { version = "64.0.*", features = ["ecma_plugin_transform"] }

# .cargo/config.toml defines aliases to build the plugin.
# cargo build-wasip1 → wasm32-wasip1 binary
# cargo build-wasm32 → wasm32-unknown-unknown binary
